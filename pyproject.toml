# uv workspace root for every Python service in the monorepo.
# Each member owns their own service pyproject; this file only wires the workspace.
[project]
name = "metacore-workspace"
version = "0.0.0"
description = "MetaCore monorepo — uv workspace root (J26-DS-317)"
requires-python = ">=3.11"
dependencies = []

# Dev tooling is declared, not assumed. `task` and `buf` are npm-distributed binaries and live in
# package.json; `dvc` is a Python package and lives here. Between the two, `pnpm install` plus
# `task setup` bootstraps the repo with no globally-installed toolchain beyond pnpm, uv and Go.
# ruff and pytest are here for the same reason: the CI lanes invoke them, and before they were
# declared, `uv sync` produced an environment the workflow then failed to run in.
[dependency-groups]
dev = [
  "dvc>=3.67",
  "httpx>=0.27",           # FastAPI TestClient transport
  "pytest>=8.3",
  "ruff>=0.14",
]

[tool.uv.workspace]
members = [
  "services/gateway",
  "services/orchestrator",
  "services/learned/module1_state_forecasting",
  "services/learned/module2_auq_engine",
  "services/learned/module3_metapolicy",
  "deterministic-core/module4_verification",
  "deterministic-core/module4_semantic_translation",
  "packages/py_common",
  "packages/contracts/python",
]

# Torch from the CPU wheel index, not PyPI. The default PyPI wheel bundles the NVIDIA CUDA
# runtime -- libcublasLt, libcufft, libtriton and friends -- which is roughly 2.5 GB installed and
# useless without an NVIDIA GPU. The CPU build is about 200 MB. Anyone training on GPU hardware
# should override this locally rather than have every laptop pay for it.
# `explicit = true` means only packages routed here by tool.uv.sources use this index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated by `task proto` and committed per ADR 0002. Not ours to format.
extend-exclude = ["packages/contracts/python/metacore_contracts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
# importlib import mode: seven services each ship a `tests/test_scaffold.py`, and the default
# prepend mode derives module names from the basename, so they collide on collection. This fixes
# it without scattering empty __init__.py files through every test directory.
addopts = "-q --import-mode=importlib"
testpaths = ["services", "deterministic-core", "packages"]
# Put each service's src/ on the path so a test lane runs without `uv sync --all-packages` first.
# Module 1 declares torch; its calibration stages are stdlib-only by design (ADR 0004) and must
# stay runnable in CI without resolving a deep-learning dependency tree to get there.
pythonpath = [
  "services/gateway",
  "services/learned/module1_state_forecasting/src",
  "services/learned/module2_auq_engine/src",
  "services/learned/module3_metapolicy/src",
  "deterministic-core/module4_verification/src",
  "deterministic-core/module4_verification",  # its tests import evaluation/ from the module root
  "deterministic-core/module4_semantic_translation/src",
]
