# DETERMINISTIC CORE — see docs/adr/0003-deterministic-core-isolation.md
# No ML dependency may be added here. infra/ci/check_core_purity.sh fails the build
# if one appears, and the same check runs as a pre-commit hook.
[project]
name = "metacore-module4-verification"
version = "0.0.0"
description = "Module 4 — OpenDSS physics firewall (Hariswara, IT23291782). ZERO ML DEPENDENCIES."
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.66",
  "pydantic>=2.9",
  "OpenDSSDirect.py==0.9.4",
  "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verification"]

# The root .gitignore excludes **/artifacts/*, which hatch honours; the frozen calibration must
# still ship, or an installed verifier answers UNVERIFIED for every certificate.
[tool.hatch.build.targets.wheel.force-include]
"src/verification/artifacts/calibration_v1.json" = "verification/artifacts/calibration_v1.json"

[tool.pytest.ini_options]
# evaluation/ is offline tooling beside the package (not shipped in the wheel); tests import it
# from the module root.
pythonpath = ["."]
