[project]
name = "metacore-orchestrator"
version = "0.0.0"
description = "Pipeline order and the mandatory Module 4 gate"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.66",
  "pydantic>=2.9",
  "nats-py>=2.9",
  "psycopg[binary]>=3.2,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
